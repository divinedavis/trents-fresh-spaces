# CSP script-src per page (2026-10-01, ZAP 10038). Every page runs only
# same-origin scripts except setup.html, whose token form is an inline script.
map $uri $tfs_script_src {
    default       "'self'";
    /setup.html   "'self' 'unsafe-inline'";
}

server {
    server_name trentsfreshspaces.com www.trentsfreshspaces.com;
    # www -> apex, so Google is not asked to choose between two identical hosts.
    if ($host = www.trentsfreshspaces.com) { return 301 https://trentsfreshspaces.com$request_uri; }


    # Google Search Console ownership token. Served by nginx because this vhost
    # proxies an app rather than a directory, so there is no docroot to put it
    # in. Google re-checks it and un-verifies the property if it disappears.
    location = /googlef630845c68076fd4.html {
        default_type text/html;
        return 200 "google-site-verification: googlef630845c68076fd4.html";
    }


    root /var/www/trents-fresh-spaces;
    index index.html;

    # Per-site log in the host-aware `site` format, so the owner dashboard can
    # count this site's visitors without guessing which vhost a line in the
    # shared access.log belonged to: the default combined format carries no
    # $host, and every site without its own log writes into it. History starts
    # the day this shipped (2026-08-20) — nothing before it is attributable.
    access_log /var/log/nginx/trents.access.log site;

    include snippets/security-headers.conf;

    location ^~ /server/ { deny all; return 404; }
    location ~ /\.(?!well-known) { deny all; return 404; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Booking API -> Node on 3007
    location /api/ {
        limit_req zone=req_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Booking management pages (Trent cancel/decline links) -> Node
    location /booking/ {
        limit_req zone=req_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    # Security audit 2026-09-05: lock browser features this site never uses.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        include snippets/security-headers.conf;
        # form-action is left unset on purpose: the estimate form posts natively to
        # formsubmit.co and that flow cannot be tested without sending a real lead.
        add_header Content-Security-Policy "default-src 'self'; script-src $tfs_script_src; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        include snippets/security-headers.conf;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        include snippets/security-headers.conf;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/trentsfreshspaces.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/trentsfreshspaces.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.trentsfreshspaces.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = trentsfreshspaces.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name trentsfreshspaces.com www.trentsfreshspaces.com;
    return 404; # managed by Certbot




}